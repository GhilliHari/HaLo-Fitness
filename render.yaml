services:
  - type: web
    name: halo-fitness-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Note: To enable persistent disks on Render, change plan to 'starter' and uncomment the disk section below:
    # disk:
    #   name: halo-data
    #   mountPath: /app/data
    #   sizeGB: 1
